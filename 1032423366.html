<!DOCTYPE html>

    <style>

            color: #2c3e50;
            display: flex;
            justify-content: center;

        .card {
            background: #ffffff;

            border: 1px solid #e1e8ed;
        }
        .header {
            background: linear-gradient(135deg, #5594ca 0%, #3a78b2 100%);
            padding: 24px 20px 50px 20px;
            text-align: center;
            position: relative;
        }
        .logo-container {
            background: #ffffff;
            padding: 10px 18px;
            border-radius: 12px;
            display: inline-block;
            box-shadow: 0 4px 10px rgba(0,0,0,0.12);
            margin-bottom: 8px;
        }
        .logo-container img {
            max-width: 170px;
            height: auto;
            display: block;
        }
        .header p {
            color: #ffffff;
            font-size: 11px;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            font-weight: 600;
            opacity: 0.95;
            margin-top: 6px;
        }
        .photo-section {
            text-align: center;
            margin-top: -42px;
            padding: 0 20px;
            position: relative;
            z-index: 2;
        }

            border: 4px solid #ffffff;

            background-color: #eef2f5;
        }

            padding: 18px 24px 16px 24px;
        }
        .name-title {
            text-align: center;
            margin-bottom: 18px;
        }
        .name-title h2 {
            font-size: 20px;
            color: #1e293b;
            font-weight: 700;
        }
        .name-title .cargo {
            display: inline-block;
            margin-top: 6px;
            padding: 5px 14px;
            background-color: #f0f8ec;
            color: #529233;
            font-size: 13px;
            font-weight: 700;
            border-radius: 20px;
            border: 1px solid #d2ebc4;
        }
        .info-grid {
            display: grid;
            gap: 10px;
            border-top: 1px solid #f1f5f9;
            padding-top: 16px;
        }
        .info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 9px 14px;
            background-color: #f8fafc;
            border-radius: 10px;
            border-left: 3px solid #5594ca;
        }
        .info-label {
            font-size: 11px;
            color: #64748b;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .info-value {
            font-size: 13px;
            color: #0f172a;
            font-weight: 600;
            text-align: right;
        }
        .status-active {
            color: #2e7d32;
            font-weight: 700;
            background-color: #e8f5e9;
            padding: 3px 10px;
            border-radius: 12px;

        .footer {
            background-color: #f8fafc;
            padding: 12px 20px;
            text-align: center;
            font-size: 11px;
            color: #64748b;
            border-top: 1px solid #f1f5f9;
